<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tadka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&family=Cormorant+Garamond:wght@300;400;500;600&family=Allura&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F3; --surface:#FFFFFF; --ink:#1F1D1B; --muted:#6E6A66; --line:#E6E3DF;
  --coral:#E35D47; --coral-soft:#FCEBE7; --gold:#F2C230; --danger:#B33A27;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161514;--surface:#211F1D;--ink:#EEEAE6;--muted:#A39E98;--line:#34312E;--coral:#F07A66;--coral-soft:#3A2420;--gold:#E8BD3A;--danger:#F08A76;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161514;--surface:#211F1D;--ink:#EEEAE6;--muted:#A39E98;--line:#34312E;--coral:#F07A66;--coral-soft:#3A2420;--gold:#E8BD3A;--danger:#F08A76;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
img{max-width:100%}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);padding:24px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.15rem;white-space:nowrap;margin:0 8px 22px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--coral);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:22px;height:22px}.logo img{width:40px;height:40px;border-radius:11px;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;color:var(--ink);font-weight:500}
.nav button[aria-current="page"]{background:var(--coral-soft);color:var(--coral)}
.nav svg{width:21px;height:21px;flex:none}
.nav .add{display:none}
.side h6{font-size:.8rem;color:var(--muted);font-weight:500;margin:18px 12px 4px}
.pins button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pins button:hover{background:var(--bg)}
.sync{margin-top:auto;font-size:.78rem;color:var(--muted);padding:12px 12px 0}
main{padding:28px clamp(16px,4vw,44px) 110px;max-width:1180px;width:100%}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.3rem);margin:0 0 4px;line-height:1.15}
h2.sec{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec button{border:0;background:none;color:var(--coral);font:500 .95rem var(--ui);cursor:pointer}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--coral-soft);color:var(--coral);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600;border:0;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 6px 10px;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.tile span{width:38px;height:38px;border-radius:50%;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center}
.tile svg{width:20px;height:20px}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,230px);gap:14px;overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;background:var(--coral-soft);display:grid;place-items:center;color:var(--coral);font-family:var(--display);font-size:2.2rem}
.card .ph{position:relative;overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cropper{position:relative;display:inline-block;touch-action:none;user-select:none;overflow:hidden;border-radius:8px;cursor:crosshair;max-width:100%}
#cropper img{display:block;max-width:100%;max-height:60vh}
#csel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);display:none;pointer-events:none}
.card .body{padding:10px 12px 12px}
.card h3{font-weight:600;font-size:1.02rem;margin:0 0 4px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:.82rem}
.empty{border:1px dashed var(--line);border-radius:14px;padding:36px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.empty h3{font-family:var(--display);font-weight:400;color:var(--ink);margin:0 0 8px;font-size:1.3rem}
.taglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.taglist button{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:600;text-align:left}
.taglist small{color:var(--muted);font-weight:500}
/* detail */
.top{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}
.hero{border-radius:16px;overflow:hidden;background:var(--coral-soft);aspect-ratio:4/3;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.info{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.info h1{font-size:clamp(1.5rem,3vw,2rem)}
.acts{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0}
.act{display:grid;justify-items:center;gap:4px;border:0;background:none;cursor:pointer;font-size:.82rem;color:var(--muted)}
.act span{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.act[aria-pressed="true"] span{background:var(--coral);border-color:var(--coral);color:#fff}
.act svg{width:20px;height:20px}
.info p.d{text-align:left;margin:6px 0 12px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem}
.pill.y{background:var(--gold);color:#1F1D1B;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-top:18px;align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.box h3{font-weight:700;font-size:1.15rem;margin:0 0 6px}
.ings{list-style:none;margin:0;padding:0}
.ings li{padding:10px 0;border-bottom:1px solid var(--line)}
.ings li:last-child{border-bottom:0}
.ings li.h{font-weight:700;border-bottom:0;padding-top:16px}
.ings b{font-weight:700}
.steps{display:grid;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:30px 1fr;gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.step em{color:var(--coral);font-style:normal}
.tipbox{background:var(--coral-soft);border-radius:16px;padding:16px 18px}
/* forms */
.form{display:grid;gap:16px;max-width:780px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.tagin{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px}
.tagin input{border:0!important;padding:4px!important;flex:1;min-width:120px;width:auto!important;background:none!important}
.tagin input:focus{outline:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photo-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-pick img{width:96px;height:72px;object-fit:cover;border-radius:8px}
.imp{display:grid;gap:8px}
.imp label{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.imp img,.imp .ph0{width:56px;height:42px;border-radius:6px;object-fit:cover;background:var(--coral-soft);flex:none}
.imp small{display:block;color:var(--muted);font-weight:400}
.box h3{margin:0}
.stars{color:var(--gold);letter-spacing:1px}
.rate{display:flex;justify-content:center;gap:2px;margin:12px 0 4px}
.rate button{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.rate button[aria-pressed="true"]{color:var(--gold)}
.made{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.vid{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;background:var(--ink);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.9rem;margin-top:12px}
.card .play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-size:.75rem}
.dthumb{width:46px;height:34px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface);cursor:pointer;font-size:.68rem;color:var(--muted)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dpick{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.dpick button{width:60px;height:44px;padding:0;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--bg);font-size:.7rem}
.dpick button[aria-pressed="true"]{border-color:var(--coral)}
.dpick img{width:100%;height:100%;object-fit:cover;display:block}
.pq{display:flex;gap:8px;align-items:center;padding:4px 0}
.pq img{width:40px;height:30px;object-fit:cover;border-radius:4px}
.pq span{flex:1;font-weight:500;font-size:.9rem}
.scl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.scl h3{margin:0}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1}
.stp span{min-width:100px;text-align:center;font-weight:600;font-size:.9rem}
.linkb{border:0;background:none;color:var(--coral);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 0;background:var(--surface);font-size:.78rem;font-weight:700}
.wk a[aria-current="date"]{border-color:var(--coral);color:var(--coral)}
.wk .th{width:30px;height:30px;border-radius:8px;background:var(--bg);overflow:hidden;border:1px dashed var(--line)}
.wk .th img{width:100%;height:100%;object-fit:cover}
.tonight{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tonight .tp{width:84px;height:84px;border-radius:12px;background:var(--coral-soft);overflow:hidden;flex:none}
.tonight .tp img{width:100%;height:100%;object-fit:cover}
.day{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.day.today{border-color:var(--coral)}
.day .dn{width:46px;flex:none;text-align:center;display:flex;flex-direction:column}
.day .dn small{color:var(--muted);font-size:.75rem;font-weight:600}
.day .dn b{font-size:1.3rem}
.pe{display:flex;gap:10px;align-items:center;padding:4px 0}
.pe .pi{width:46px;height:46px;border-radius:10px;background:var(--coral-soft);overflow:hidden;flex:none}
.pe .pi img{width:100%;height:100%;object-fit:cover}
.pe a{flex:1;color:var(--ink);text-decoration:none;font-weight:600;line-height:1.25}
.pe small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.pick{border:1px dashed var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;margin-top:6px}
.pick ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.pick li button{width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink)}
.pick li button:hover{background:var(--bg)}
.pick li small{color:var(--muted);font-weight:400}
.gsec h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.gl{list-style:none;margin:0;padding:0}
.gl li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.gl .ck{width:26px;height:26px;flex:none;border:2px solid var(--muted);border-radius:7px;background:var(--surface);cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.gl .ck[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.gl .ck svg{width:16px;height:16px}
.gl .gt{flex:1}
.gl .gt small{display:block;color:var(--muted);font-size:.78rem}
.gl li.done .gt span{text-decoration:line-through;color:var(--muted)}
.gl.big li{padding:16px 0}
.gl.big .gt span{font-size:1.15rem;font-weight:600}
.gl.big .ck{width:34px;height:34px}
.pantry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.pantry .chips{margin:0}
.chip.have{text-decoration:line-through;color:var(--muted);background:var(--bg)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink)}
.onebox{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.onebox.drag{border-color:var(--coral);background:var(--coral-soft)}
.onebox textarea{min-height:170px;border:0;padding:0;background:none}
.onebox textarea:focus{outline:none}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.addgrid .tile{cursor:pointer}
.bigacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px}
.bigacts .btn{min-height:44px}
.cook{max-width:760px;margin:0 auto;display:grid;gap:20px}
.cook .cstep{font-size:clamp(1.4rem,4.2vw,2rem);line-height:1.4;font-weight:600;margin:0}
.cook .ctimer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.4rem}
.cook .nav2{display:flex;gap:10px}
.cook .nav2 .btn{flex:1;min-height:54px;font-size:1rem}
/* builder */
.builder{display:grid;grid-template-columns:370px 1fr;gap:24px;align-items:start}
.panel{display:grid;gap:10px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
summary{cursor:pointer;font-weight:700;padding:12px 0;list-style-position:inside}
details>div{display:grid;gap:14px;padding:4px 0 16px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 8px;cursor:pointer;font-size:.85rem;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset;background:var(--coral-soft)}
.sw{display:flex;gap:8px}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 2px var(--surface) inset}
.chap{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chap span{flex:1;font-weight:600}
.chap button{border:0;background:none;cursor:pointer;padding:2px 6px;color:var(--muted)}
.picks{max-height:240px;overflow:auto;display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px}
.picks label,.toggle{display:flex;gap:8px;align-items:center;font-weight:500}
.picks label{padding:4px 6px;border-radius:6px}
.picks small{color:var(--muted);margin-left:auto;font-weight:400}
.preview-wrap{background:var(--line);border-radius:14px;padding:20px;overflow-x:auto}
.pnote{font-size:.85rem;color:var(--muted);margin:0 0 12px}
#preview{display:flex;flex-direction:column;align-items:center;gap:18px}
#preview .pg{box-shadow:0 2px 12px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
#printRoot{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;height:auto;padding:6px;border:1px solid var(--line);border-radius:22px;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:visible}
  .brand,.sync,.side h6,.pins{display:none}
  .nav{flex-direction:row;justify-content:space-around;align-items:center}
  .nav button{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px;width:auto;color:var(--muted)}
  .nav .add{display:flex}
  .nav .add svg{width:46px;height:46px;padding:12px;border-radius:50%;background:var(--coral);color:#fff}
  .nav .add .lbl{display:none}
  .nav .hide-m{display:none}
  .top,.cols,.builder{grid-template-columns:1fr}
  .acts{gap:6px}
  .act{font-size:.74rem;min-width:54px}
  .act span{width:42px;height:42px}
  .panel{position:static;max-height:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  main{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="bookcss">
.bk{--tone:#EDE8E2;--ink:#4A4643;--soft:#9A928A;--line:#D9D2CA}
.bk.p-sage{--tone:#E2E7DF;--ink:#3E4A41;--soft:#87938A;--line:#C9D2C7}
.bk.p-blush{--tone:#F3E5E0;--ink:#57433F;--soft:#A88F89;--line:#E5CFC8}
.bk.p-charcoal{--tone:#E5E4E2;--ink:#2D2D2D;--soft:#7D7C79;--line:#CFCECB}
.bk .pg{width:var(--pw);min-height:var(--ph);background:#fff;color:var(--ink);font:400 8.5pt/1.65 "Montserrat",Helvetica,Arial,sans-serif;position:relative;break-after:page;page-break-after:always;display:flex;flex-direction:column;overflow:hidden}
.bk .pg:last-child{break-after:auto;page-break-after:auto}
.bk .fx{height:var(--ph)}
.bk img{display:block;object-fit:cover;width:100%;max-width:none}
.bk .ph0{background:var(--tone)}
.bk .t{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:400;text-transform:uppercase;letter-spacing:.16em;line-height:1.1;margin:0}
.bk .sc{font-family:"Allura","Brush Script MT",cursive;font-size:20pt;line-height:1.1}
.bk .lab{font-size:6.5pt;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.bk .num{font-family:"Cormorant Garamond",serif;font-weight:300;line-height:.8;color:var(--ink);opacity:.13}
.bk .desc{color:var(--soft);font-size:8pt;margin:.08in auto 0;max-width:4.2in}
.bk .icons{display:flex;gap:.32in;justify-content:center;margin:.14in 0}
.bk .ic{text-align:center;font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.bk .ic svg{width:13px;height:13px;display:block;margin:0 auto 3px;color:var(--ink)}
.bk .ic b{display:block;font-weight:500;color:var(--ink);letter-spacing:.04em;font-size:7pt}
.bk h4{font-family:"Cormorant Garamond",serif;font-weight:600;text-transform:uppercase;letter-spacing:.22em;font-size:9pt;margin:.16in 0 .08in}
.bk ul.ing{list-style:none;margin:0;padding:0}
.bk ul.ing li{display:flex;gap:7px;margin:0 0 3px;break-inside:avoid}
.bk ul.ing li::before{content:"";flex:none;width:7px;height:7px;border:1px solid var(--ink);margin-top:4px}
.bk ul.ing li.ih{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:6.8pt;margin-top:6px}
.bk ul.ing li.ih::before{display:none}
.bk ol.ins{margin:0;padding-left:1.3em}
.bk ol.ins li{margin:0 0 5px;break-inside:avoid}
.bk .two{columns:2;column-gap:.28in}
.bk .tip{background:var(--tone);padding:.14in .2in;margin-top:.16in;text-align:center}
.bk .tip h4{margin-top:0}
.bk .see{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.02in 0 .1in;margin-top:.16in;text-align:center}
.bk .see h4{margin:.06in 0}
.bk .pgref{color:var(--soft);font-style:italic}
.bk .folio{position:absolute;bottom:.28in;left:0;right:0;text-align:center;font-size:6.5pt;letter-spacing:.2em;color:var(--soft)}
.bk .src{font-size:6.5pt;color:var(--soft);margin-top:.12in;letter-spacing:.06em}
/* covers */
.bk .cva{padding:.4in;outline:1px solid var(--line);outline-offset:-.2in}
.bk .cva .cvt{text-align:center;padding:.3in 0 .22in}
.bk .cva h1{font-size:30pt}
.bk .cva .cvi{flex:1;min-height:0;height:auto}
.bk .cva .cvf{text-align:center;padding-top:.18in}
.bk .cvb .hd{background:var(--tone);text-align:center;padding:.55in .4in .3in}
.bk .cvb h1{font-size:30pt}
.bk .cvb .cvi{flex:1;min-height:0;height:auto}
.bk .cvb .ft{background:var(--tone);text-align:center;padding:.3in .4in .45in}
.bk .cvc{border-left:.3in solid var(--tone);border-right:.3in solid var(--tone);padding:.5in .35in .45in;text-align:center}
.bk .cvc h1{font-size:28pt;margin:.04in 0 .25in}
.bk .cvc .cvi{flex:1;min-height:0;height:auto}
.bk .cvc .lab{margin-top:.25in}
.bk .cvd{display:grid;grid-template-columns:1in 1fr;grid-template-rows:1fr auto}
.bk .cvd .sp{grid-row:1/3;background:var(--tone);display:flex;align-items:flex-end;justify-content:center;padding:.4in 0}
.bk .cvd .sp h1{writing-mode:vertical-rl;transform:rotate(180deg);font-size:34pt}
.bk .cvd .cvi{height:100%;min-height:0}
.bk .cvd .ft{text-align:center;padding:.3in .3in .45in}
/* dividers */
.bk .dv{justify-content:center;align-items:center;text-align:center}
.bk .dv .ov{position:relative;z-index:1}
.bk .dv .num{font-size:150pt;position:absolute;left:50%;top:50%;transform:translate(-62%,-55%);z-index:0}
.bk .dv h2{font-size:24pt;position:relative;letter-spacing:.2em}
.bk .dv1{flex-direction:row;justify-content:flex-start}
.bk .dv1 .cvi{width:55%;height:100%;flex:none}
.bk .dv1 .ovw{position:absolute;inset:0;display:grid;place-items:center}
.bk .dv1 h2{background:linear-gradient(90deg,transparent,rgba(255,255,255,.75) 20%,rgba(255,255,255,.75) 80%,transparent);padding:.1in .3in}
.bk .dv2 .bgi{position:absolute;inset:0;height:100%;opacity:.32}
.bk .dv3{display:grid;grid-template-rows:1fr auto 1fr;gap:.12in;padding:.35in}
.bk .dv3 .cl{display:grid;grid-template-columns:1fr 1fr;gap:.12in;min-height:0}
.bk .dv3 .cl>*{height:100%;min-height:0}
.bk .dv3 h2{padding:.12in 0}
/* recipe layouts */
.bk .rc{padding:.55in .55in .6in}
.bk .rc .hd{text-align:center}
.bk .rc h2{font-size:19pt}
.bk .ra{display:grid;grid-template-columns:32% 1fr;padding:0}
.bk .ra .si{height:100%;min-height:var(--ph)}
.bk .ra .ct{padding:.55in .5in .6in}
.bk .ra .hd{text-align:left;background:var(--tone);margin:-.55in -.5in .1in;padding:.5in .5in .25in}
.bk .ra .desc{margin-left:0}
.bk .ra .icons{justify-content:flex-start}
.bk .rb{padding:0}
.bk .rb .ti{height:calc(var(--ph)*.36);flex:none}
.bk .rb .ct{padding:.35in .6in .6in}
.bk .rc .band{background:var(--tone);margin:.1in -.55in;padding:.12in .55in .2in}
.bk .rc .bot{margin:auto -.55in -.6in;height:2.1in;width:calc(100% + 1.1in);flex:none}
.bk .rd{padding:0}
.bk .rd .tp{display:grid;grid-template-columns:1fr 40%}
.bk .rd .tp .ri{height:4.1in}
.bk .rd .tp .ct{padding:.55in .35in .2in .55in}
.bk .rd .tp .hd{text-align:left}
.bk .rd .tp .icons{justify-content:flex-start}
.bk .rd .tp .desc{margin-left:0}
.bk .rd .bt{padding:0 .55in .6in}
/* other pages */
.bk .wl .wi{height:45%;flex:none}
.bk .wl .ct{padding:.4in .7in;text-align:center}
.bk .wl h2{font-size:22pt;margin:.06in 0}
.bk .wl p{margin:.1in 0;text-align:left}
.bk .toc{padding:.7in .8in}
.bk .toc>h2{font-size:24pt;text-align:center;margin-bottom:.35in}
.bk .tch{display:flex;align-items:baseline;gap:.12in;margin:.2in 0 .06in}
.bk .tch .num{font-size:26pt;opacity:.3}
.bk .tch h3{font-size:11pt}
.bk .tr{display:flex;gap:6px;align-items:baseline;margin:3px 0 3px .45in}
.bk .toc>.tr:first-of-type,.bk .toc>h2+.tr{margin-top:0}
.bk .toc>h2~.tr{margin-left:0}
.bk .toc>.tch~.tr{margin-left:.45in}
.bk .tr i{flex:1;border-bottom:1px dotted var(--soft);transform:translateY(-3px)}
.bk .qt{justify-content:center;padding:.8in}
.bk .qt .bgi{position:absolute;inset:0;height:100%;opacity:.3}
.bk .qt p{position:relative;font-family:"Cormorant Garamond",serif;text-transform:uppercase;letter-spacing:.3em;font-size:15pt;line-height:2.2;margin:0}
.bk .qt .lab{position:absolute;right:.7in;bottom:.7in}
.bk .pl{padding:.6in}
.bk .pl h2,.bk .cd h2,.bk .ty h2{font-size:22pt;text-align:center}
.bk .plg{display:grid;grid-template-columns:1.3fr 1fr;gap:.25in;flex:1;margin-top:.25in}
.bk .day{background:var(--tone);padding:.06in .1in;height:.95in;margin-bottom:.06in}
.bk .ln{border-bottom:1px solid var(--line);height:.27in;display:flex;align-items:flex-end;gap:6px}
.bk .ln.bx::before{content:"";width:7px;height:7px;border:1px solid var(--ink);margin-bottom:4px}
.bk .cd{padding:.6in}
.bk .cdg{display:grid;grid-template-columns:1fr 1.4fr;gap:.3in;margin-top:.2in}
.bk .nb{border:1px solid var(--line);height:1.1in;padding:.08in;margin-top:.2in}
.bk .ty{justify-content:center;text-align:center;padding:.7in}
.bk .ty .sc{font-size:22pt;margin:.15in 0 .3in}
.bk .ty .cl{display:grid;grid-template-columns:repeat(3,1fr);gap:.1in;height:2.2in}
.bk .ty .cl>*{height:100%}

<script>
(() => {
const LS_KEY="cookbook-studio-v1";
const PALETTES={linen:["Linen","#EDE8E2"],sage:["Sage","#E2E7DF"],blush:["Blush","#F3E5E0"],charcoal:["Charcoal","#D9D8D5"]};
const COVERS={a:"Framed title",b:"Soft bands",c:"Side panels",d:"Spine title"};
const LAYOUTS={mix:"Mix all layouts",a:"Side photo",b:"Photo on top",c:"Text first",d:"Photo right"};
const SIZES={letter:["Letter 8.5 × 11 in",8.5,11],b8x10:["8 × 10 in",8,10],t6x9:["6 × 9 in",6,9]};
const DEF_BOOK={divPhotos:{},title:"Cookbook",subtitle:"simple & homemade",author:"",palette:"linen",cover:"a",layout:"mix",size:"letter",coverPhoto:"",
  chapters:[],untagged:true,selected:[],toc:true,dividers:true,
  welcome:false,welcomeTitle:"Welcome",welcomeText:"",quote:false,quoteText:"",quoteBy:"",planner:false,card:false,thanks:true,thanksText:"Thank you for cooking with me.",withLinked:true};
const state={plan:{days:{}},groc:{items:[],pantry:[]},wk:0,gview:"aisle",recipes:[],book:{...DEF_BOOK},imgs:{cover:"",welcome:""},view:"home",current:null,draft:null,filter:"",q:"",fav:false};
const store={mode:"local",col:null,downloads:null,sample:null,imagesOk:false,unsynced:new Set(),lastErr:null};
const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rawLines=s=>String(s||"").split(/\n/).map(x=>x.trim()).filter(Boolean);
const clean=x=>x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,"").trim();
const isHead=x=>/^#/.test(x)||/:$/.test(x);
const headText=x=>x.replace(/^#+\s*/,"").replace(/:$/,"");
const uid=()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)}
function normTag(t){return String(t||"").replace(/\s+/g," ").trim()}
function normalize(r){
  const o={...r};
  if(!Array.isArray(o.tags)) o.tags=o.category&&o.category!=="Other"?[o.category]:[];
  if(o.description==null) o.description=o.story||"";
  delete o.category; delete o.story;
  ["servings","prep","cook","ingredients","steps","tip","source","photo","video"].forEach(k=>{if(o[k]==null)o[k]=""});
  o.rating=+o.rating||0; o.cooked=+o.cooked||0; if(o.calories==null)o.calories=""; o.calories=String(o.calories); o.caloriesEst=!!o.caloriesEst; if(o.servingSize==null)o.servingSize="";
  o.fav=!!o.fav; o.pinned=!!o.pinned; if(!Array.isArray(o.links))o.links=[]; return o;
}
function allTags(){const m=new Map();state.recipes.forEach(r=>r.tags.forEach(t=>{const k=t.toLowerCase();if(!m.has(k))m.set(k,{name:t,count:0});m.get(k).count++}));return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name))}
const hasTag=(r,t)=>r.tags.some(x=>x.toLowerCase()===t.toLowerCase());

/* storage */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(d){state.recipes=(d.recipes||[]).map(normalize);store.unsynced=new Set(d.unsynced||[]);Object.assign(state.book,d.book||{});Object.assign(state.imgs,d.imgs||{});if(d.plan)state.plan={days:d.plan.days||{}};if(d.groc)state.groc={items:d.groc.items||[],pantry:d.groc.pantry||[]}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({recipes:state.recipes,book:state.book,imgs:state.imgs,plan:state.plan,groc:state.groc,unsynced:[...store.unsynced]}))}catch(e){try{localStorage.setItem(LS_KEY,JSON.stringify({recipes:state.recipes,book:state.book,unsynced:[...store.unsynced]}))}catch(e2){}}}
async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user,dl,sample]=await Promise.all(["db","user","downloads","sample"].map(n=>claude.use(n)));
    store.downloads=dl; store.sample=sample;
    if(sample){ $("#navPaste").hidden=false; try{const l=await sample.limits(); store.imagesOk=!!l?.images;store.maxImgs=l?.images?.maxCount||4}catch(e){} if(state.view==="home")render(); }
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    store.col=db.collection("data/users/"+id); store.mode="cloud";
    $("#sync").textContent="Synced to your account";
    let first=true;
    store.col.onSnapshot(snap=>{
      if(first&&snap.empty&&state.recipes.length){first=false;migrate();return}
      first=false;
      const recs=[];
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;
        if(d.id==="book"){const {kind,...rest}=v;Object.assign(state.book,rest)}
        else if(d.id==="plan")state.plan={days:v.days||{}}
        else if(d.id==="grocery")state.groc={items:v.items||[],pantry:v.pantry||[]}
        else if(v.kind==="bookimg") state.imgs[d.id.replace("img_","")]=v.data||"";
        else if(v.kind==="recipe") recs.push(normalize({...v,id:d.id}))});
      const have=new Set(recs.map(r=>r.id));state.recipes.forEach(r=>{if(store.unsynced.has(r.id)&&!have.has(r.id))recs.push(r)});
      state.recipes=recs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      if(store.unsynced.size&&!store.retrying){store.retrying=true;setTimeout(async()=>{for(const id of [...store.unsynced]){const r=state.recipes.find(x=>x.id===id);if(r)await putRecipe(r,true,true);else store.unsynced.delete(id)}store.retrying=false;updSync()},800)}
      updSync();
      saveLocal(); drawPins();
      if(!["edit","paste","book","groceries","cook","plan"].includes(state.view)) render();
      else if(state.view==="book") drawPreview();
    },()=>{$("#sync").textContent="Sync paused. Saving on this device"});
  }catch(e){}
}
async function migrate(){for(const r of state.recipes) await putRecipe(r,true,true); await putBook(); for(const k in state.imgs) if(state.imgs[k]) await putImg(k)}
async function putRecipe(r,silent,keepTime){
  if(!keepTime) r.updatedAt=Date.now();
  const i=state.recipes.findIndex(x=>x.id===r.id); if(i>=0) state.recipes[i]=r; else state.recipes.unshift(r);
  saveLocal(); drawPins();
  if(store.mode==="cloud"){const {id,...body}=r;try{await store.col.doc(id).set({...body,kind:"recipe"});store.unsynced.delete(id);saveLocal();updSync();return true}catch(e){store.unsynced.add(id);store.lastErr=e;saveLocal();updSync();if(!silent)toast(errMsg(e));return false}}
  return true;
}
function errMsg(e){return e?.code==="quota_exceeded"?"Your storage is full. Remove a few photos and try again.":/large|size|limit/i.test((e?.code||"")+(e?.message||""))?"A recipe is too large to sync. Try a smaller photo.":"Syncing to your account failed."}
function updSync(){if(store.mode!=="cloud")return;const n=store.unsynced.size;$("#sync").textContent=n?`${n} recipe${n>1?"s":""} not synced yet`:"Synced to your account"}
async function removeRecipe(id){
  state.recipes=state.recipes.filter(r=>r.id!==id); state.recipes.forEach(x=>{if(x.links.some(l=>l.id===id)){x.links=x.links.filter(l=>l.id!==id);putRecipe(x,true,true)}}); state.book.selected=state.book.selected.filter(x=>x!==id); saveLocal(); drawPins();
  if(store.mode==="cloud"){try{await store.col.doc(id).delete()}catch(e){} putBook()}
}
let pt,gt;
function putPlan(){saveLocal();clearTimeout(pt);pt=setTimeout(()=>{if(store.mode==="cloud")store.col.doc("plan").set({kind:"plan",days:state.plan.days}).catch(()=>toast("Plan saved on this device only."))},500)}
function putGroc(){saveLocal();clearTimeout(gt);gt=setTimeout(()=>{if(store.mode==="cloud")store.col.doc("grocery").set({kind:"grocery",items:state.groc.items,pantry:state.groc.pantry}).catch(()=>toast("List saved on this device only."))},500)}
let bt;
function putBook(){saveLocal();clearTimeout(bt);return new Promise(res=>{bt=setTimeout(async()=>{if(store.mode==="cloud"){try{await store.col.doc("book").set({...state.book,kind:"book"})}catch(e){}}res()},600)})}
async function putImg(k){saveLocal();if(store.mode==="cloud"){try{await store.col.doc("img_"+k).set({kind:"bookimg",data:state.imgs[k]})}catch(e){toast("Photo saved on this device only.")}}}
function shrinkSrc(src,max=1000,limit=190000){
  return new Promise((res,rej)=>{const img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);let q=.8,o=c.toDataURL("image/jpeg",q);limit=Math.min(limit,170000);while(o.length>limit&&q>.35){q-=.1;o=c.toDataURL("image/jpeg",q)}res(o)};
    img.onerror=()=>rej();img.src=src});
}
function cropSrc(src,b){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const x0=Math.min(b[0],b[2]),y0=Math.min(b[1],b[3]),x1=Math.max(b[0],b[2]),y1=Math.max(b[1],b[3]),W=img.naturalWidth,H=img.naturalHeight;const c=document.createElement("canvas");c.width=Math.max(1,Math.round((x1-x0)*W));c.height=Math.max(1,Math.round((y1-y0)*H));c.getContext("2d").drawImage(img,x0*W,y0*H,c.width,c.height,0,0,c.width,c.height);shrinkSrc(c.toDataURL("image/png")).then(res,rej)};img.onerror=()=>rej();img.src=src})}
async function shrinkImage(file,max,limit){const url=URL.createObjectURL(file);try{return await shrinkSrc(url,max,limit)}finally{URL.revokeObjectURL(url)}}

/* nav */
function setView(v,cur=null){

  const fail=(e,n)=>{const c=e?.code||"error";const m=c==="not_granted"?"Claude access was turned down. Reload the page and choose Allow when asked.":c==="rate_limited"?"Too many requests. Wait a minute and try again.":c==="image_rejected"?"That photo or page couldn’t be read. Take a screenshot of it and try that instead.":c==="images_unavailable"?"This view can’t send pictures to Claude. Open the app in a web browser, or send the file to me in chat.":(c==="refused"||c==="empty_completion")?"Claude couldn’t read that.":"Couldn’t read all of it.";st(n?`${m} Saving the ${n} found so far.`:`${m} (Error: ${c})`);toast(m)};
  const done=async list=>{

    for(const d of list.filter(r=>r._dup&&r.photo)){const ex=state.recipes.find(x=>key(x.title)===key(d.title));if(ex&&!ex.photo){ex.photo=d.photo;await putRecipe(ex,true,true);photosAdded++;d._photoDone=true}}

    const fresh=list.filter(r=>!r._dup),dups=list.filter(r=>r._dup&&!r._photoDone);

  $("#p-go").onclick=async()=>{

    try{await aiExtract(text,files,st,got)}catch(e){fail(e,got.length);if(!got.length){btn.disabled=false;return}}

  let dirFiles=null;
  $("#p-dir").onchange=e=>{IMGMAP={};[...e.target.files].forEach(f=>{if(/\.(jpe?g|png|webp|gif)$/i.test(f.name))IMGMAP[f.name]=URL.createObjectURL(f)});dirFiles=[...e.target.files].filter(f=>/\.(cookbook|json|pdf|html?|txt|csv|md|xml)$/i.test(f.name)&&!f.name.startsWith("."));st(dirFiles.length?`${dirFiles.length} recipe files found in the folder. Importing…`:"No recipe files found in that folder.");if(dirFiles.length)$("#p-imp").click()};
  $("#p-file").onchange=()=>{dirFiles=null;if($("#p-file").files.length)$("#p-imp").click()};
  $("#p-imp").onclick=async()=>{

    const btn=$("#p-imp");btn.disabled=true;const got=[],skipped=[],badPages=[];let attached=0,already=0,noimg=0;const tkey=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

          const r=await readPdf(f,sst);

          const matchT=ls=>{if(!ls.length)return null;const a=tkey(ls[0]),b=tkey(ls[0]+" "+(ls[1]||""));return idx.get(b)||idx.get(a)||(a.length>=12?state.recipes.find(x=>tkey(x.title).startsWith(a)):null)||null};
          const hits=[];const seen=new Set();r.pages.forEach((t,i)=>{const ex=matchT(t.split("\n").map(s=>s.trim()).filter(Boolean));if(ex&&!seen.has(ex.id)){seen.add(ex.id);hits.push([i+1,ex])}});
          if(hits.length){for(const [pn,ex] of hits){if(ex.photo){already++;continue}sst(hits.length>1?`Adding photos: page ${pn} of ${r.doc.numPages}…`:"Adding the photo…");let im="";try{im=await pdfPhoto(r.doc,pn)}catch(e){}
              if(im){try{ex.photo=await shrinkSrc(im);await putRecipe(ex,true,true);attached++}catch(e){}}else noimg++}continue}
          let pimg="";try{pimg=await pdfPhoto(r.doc)}catch(e){}
          if(!store.sample){skipped.push(f.name);continue}
          const n0=got.length;
          if(r.text.trim()) await aiExtract(r.text,[],sst,got);
          if(pimg&&got.length>n0&&!got[n0]._img)got[n0]._img=pimg;
          if(r.scan.length){
            if(!store.imagesOk){skipped.push(f.name);continue}

            for(let a=0;a<S.length;a+=n){const grp=S.slice(a,a+n);sst(S.length>1?`Reading scanned pages ${a+1} to ${a+grp.length} of ${S.length}…`:"Reading the scanned page…");
              const imgs=[],pgs=[];for(const pn of grp){const bl=(await pdfPagesToImages(r.doc,pn,pn))[0];if(bl&&bl.size){imgs.push(bl);pgs.push(pn)}else badPages.push(pn)}
              if(!imgs.length)continue;
              const ask=(ims,label)=>store.sample.json(IMPORT_PROMPT(`(scanned PDF ${label}, attached as images in page order. If a recipe is cut off at the start or end, include what is visible.)`,true),{images:ims});
              let j=null;
              try{j=await ask(imgs,"pages "+pgs.join(", "))}catch(e){if(e?.code!=="image_rejected")throw e;
                for(let q=0;q<imgs.length;q++){sst(`Retrying page ${pgs[q]}…`);try{const jj=await ask([imgs[q]],"page "+pgs[q]);(jj?.recipes||[]).forEach(x=>got.push(mapRecipe(x)))}catch(e2){if(e2?.code!=="image_rejected")throw e2;badPages.push(pgs[q])}}}
              (j?.recipes||[]).forEach(x=>got.push(mapRecipe(x)))}}
        }else{
          let r;try{r=await readFile(f)}catch(e){skipped.push(f.name);continue}

      if(e?.message==="pdf_lib")st("Couldn’t load the PDF reader. Check your connection and try again.");
      else if(e?.name==="PasswordException")st("That PDF is password protected. Remove the password and try again.");

    }
    if(attached||already||noimg){toast([attached?`Added photos to ${attached} recipe${attached>1?"s":""}`:"",already?`${already} already had a photo`:""].filter(Boolean).join(". "))}
    if(!got.length&&(attached||already||noimg)){btn.disabled=false;return st(`Done. ${attached} photo${attached===1?"":"s"} added to recipes you already had${already?`, ${already} skipped because they already have one`:""}${noimg?`, ${noimg} had no photo in the PDF`:""}.`)}

    if(skipped.length)toast(`Skipped ${skipped.length} file${skipped.length>1?"s":""} that need Claude access`);
    if(badPages.length)toast(`Couldn’t read page${badPages.length>1?"s":""} ${badPages.join(", ")}. Everything else was imported.`);
    st("");done(await finishImport(got,{}));
  };
}

const svgI={prep:'<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>',cook:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cal:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 2 2 2 3 0-3 0-5 1-7z"/>',serv:'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 20a5 5 0 0 1 10 0M11 20a5 5 0 0 1 10 0"/>'};
const bi=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${svgI[k]}</svg>`;
const im=(src,cls="")=>src?`<img class="${cls}" src="${src}" alt="">`:`<div class="${cls} ph0"></div>`;
function chaptersFor(recs){
  const b=state.book, out=[];
  b.chapters.forEach(t=>out.push({name:t,recs:[]}));
  const more={name:"More recipes",recs:[]};
  recs.forEach(r=>{const c=out.find(c=>hasTag(r,c.name));if(c)c.recs.push(r);else if(b.untagged||!b.chapters.length)more.recs.push(r)});
  if(!b.chapters.length) more.name="Recipes";
  const res=out.filter(c=>c.recs.length);if(more.recs.length)res.push(more);

}
function icons(r){const it=[["prep","Prep time",r.prep],["cook","Cook time",r.cook],["serv","Servings",r.servings?r.servings+(r.servingSize?" ("+r.servingSize+")":""):""],["cal","Calories",r.calories?r.calories+" / serving":""]].filter(x=>x[2]);return it.length?`<div class="icons">${it.map(x=>`<div class="ic">${bi(x[0])}${x[1]}<b>${esc(x[2])}</b></div>`).join("")}</div>`:""}

   <details open><summary>Chapters: pick which tags break down the book</summary><div>
    <p class="hint" style="margin:0">Tap a tag below to make it a chapter, and use the arrows to set the order. A recipe goes in the first chapter it matches. Tap a chapter’s photo to change its title-page picture.</p>
    ${tags.length?`<div style="display:grid;gap:6px">${b.chapters.map((c,i)=>{const cr=state.recipes.filter(r=>hasTag(r,c)),src=divSrc(c,cr),k=chKey(c),cur=(b.divPhotos||{})[k]||"";return `<div class="chap"><button class="dthumb" data-dph="${i}" aria-label="Change photo for ${esc(c)}">${src?`<img src="${src}" alt="">`:"Photo"}</button><span>${pad(i+1)} ${esc(c)}</span><button data-up="${i}" aria-label="Move up">▲</button><button data-dn="${i}" aria-label="Move down">▼</button><button data-rm="${i}" aria-label="Remove chapter">✕</button></div>${state.divOpen===i?`<div class="dpick"><button data-dset="" data-ck="${k}" aria-pressed="${!cur}">Auto</button>${cr.filter(r=>r.photo).map(r=>`<button data-dset="${r.id}" data-ck="${k}" aria-pressed="${cur===r.id}" title="${esc(r.title)}"><img src="${r.photo}" alt="${esc(r.title)}"></button>`).join("")}<label class="btn sm" style="display:inline-flex;align-items:center;cursor:pointer">Upload<input type="file" accept="image/*" data-dup="${k}" hidden></label></div>`:""}`}).join("")}</div>
    <div class="chips" style="margin:0">${tags.filter(t=>!b.chapters.some(c=>c.toLowerCase()===t.name.toLowerCase())).map(t=>`<button class="chip" data-addch="${esc(t.name)}">+ ${esc(t.name)}</button>`).join("")}</div>`:`<p class="hint" style="margin:0">Add tags to your recipes first.</p>`}
    <label class="toggle"><input type="checkbox" data-b="untagged" ${b.untagged?"checked":""}> Put other recipes in “More recipes”</label>
    <label class="toggle"><input type="checkbox" data-b="dividers" ${b.dividers?"checked":""}> Chapter title pages</label>
   </div></details>
   <details><summary>Extra pages</summary><div>
    <label class="toggle"><input type="checkbox" data-b="toc" ${b.toc?"checked":""}> Table of contents</label>
    <label class="toggle"><input type="checkbox" data-b="welcome" ${b.welcome?"checked":""}> Welcome or about me</label>
    <div ${b.welcome?"":"hidden"} style="display:grid;gap:10px"><label>Heading<input type="text" data-k="welcomeTitle" value="${esc(b.welcomeTitle)}"></label><label>Text<textarea data-k="welcomeText" style="min-height:90px">${esc(b.welcomeText)}</textarea></label><label>Photo <span class="hint">Optional</span><input type="file" id="b-wup" accept="image/*"></label></div>
    <label class="toggle"><input type="checkbox" data-b="quote" ${b.quote?"checked":""}> Quote page</label>
    <div ${b.quote?"":"hidden"} style="display:grid;gap:10px"><label>Quote<textarea data-k="quoteText" style="min-height:60px">${esc(b.quoteText)}</textarea></label><label>Said by<input type="text" data-k="quoteBy" value="${esc(b.quoteBy)}"></label></div>
    <label class="toggle"><input type="checkbox" data-b="planner" ${b.planner?"checked":""}> Weekly meal planner</label>
    <label class="toggle"><input type="checkbox" data-b="card" ${b.card?"checked":""}> Blank recipe card</label>
    <label class="toggle"><input type="checkbox" data-b="thanks" ${b.thanks?"checked":""}> Thank you page</label>
    <div ${b.thanks?"":"hidden"}><label>Message<input type="text" data-k="thanksText" value="${esc(b.thanksText)}"></label></div>
   </div></details>
   <details><summary>Photo check</summary><div id="pcheck"><p class="hint" style="margin:0">Checking photos…</p></div></details>
   <details><summary>Recipes in the book (${b.selected.length})</summary><div>
    <div class="bar" style="margin:0"><select id="b-tagsel" style="flex:1;min-width:140px"><option value="">Pick by tag…</option>${tags.map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${t.count})</option>`).join("")}</select><button class="btn sm" id="b-tagonly">Only these</button><button class="btn sm" id="b-tagadd">Add these</button></div>
    <label class="toggle"><input type="checkbox" data-b="withLinked" ${b.withLinked?"checked":""}> Add linked recipes automatically</label>
    ${state.recipes.length?`<div class="bar" style="margin:0"><button class="btn sm" id="all">Select all</button><button class="btn sm" id="none">Clear</button></div><div class="picks">${state.recipes.map(r=>`<label><input type="checkbox" data-id="${r.id}" ${b.selected.includes(r.id)?"checked":""}> ${esc(r.title)}<small>${esc(r.tags.join(", "))}</small></label>`).join("")}</div>`:`<p class="hint" style="margin:0">Add recipes first.</p>`}
   </div></details>
   <div class="bar" style="margin:4px 0 0"><button class="btn primary" id="print">Print</button><button class="btn" id="dl" ${store.downloads?"":"hidden"}>Download print file</button></div>
   <p class="hint" style="margin:0">Choose “Save as PDF” in the print window to make a PDF. If printing doesn’t open here, use Download print file.</p>
  </div><div class="preview-wrap"><p class="pnote" id="pnote"></p><div id="preview"></div></div></div>`;
  drawPreview();
  const upd=(k,v,re)=>{state.book[k]=v;putBook();re?renderBook():drawPreview()};
  main.querySelectorAll("[data-pal]").forEach(x=>x.onclick=()=>upd("palette",x.dataset.pal,true));
  main.querySelectorAll(".opt").forEach(x=>x.onclick=()=>upd(x.dataset.g,x.dataset.v,true));
  $("#b-size").onchange=e=>upd("size",e.target.value);
  main.querySelectorAll("[data-k]").forEach(x=>x.addEventListener("input",()=>upd(x.dataset.k,x.value)));
  main.querySelectorAll("[data-b]").forEach(x=>x.onchange=()=>upd(x.dataset.b,x.checked,["welcome","quote","thanks"].includes(x.dataset.b)));
  $("#b-cphoto").onchange=e=>upd("coverPhoto",e.target.value,true);
  const up=(id,k)=>{const el=$(id);if(el)el.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state.imgs[k]=await shrinkImage(f,1400,220000);await putImg(k);drawPreview();toast("Photo added")}catch{toast("That file isn’t an image this browser can read.")}}};
  up("#b-cup","cover");up("#b-wup","welcome");
  main.querySelectorAll("[data-dph]").forEach(x=>x.onclick=()=>{state.divOpen=state.divOpen===+x.dataset.dph?null:+x.dataset.dph;renderBook()});
  main.querySelectorAll("[data-dset]").forEach(x=>x.onclick=()=>{const dp={...(b.divPhotos||{})};if(x.dataset.dset)dp[x.dataset.ck]=x.dataset.dset;else delete dp[x.dataset.ck];upd("divPhotos",dp,true)});
  main.querySelectorAll("[data-dup]").forEach(x=>x.onchange=async e=>{const f=e.target.files[0];if(!f)return;const k=x.dataset.dup;try{state.imgs["div_"+k]=await shrinkImage(f,1400,200000);await putImg("div_"+k);upd("divPhotos",{...(b.divPhotos||{}),[k]:"upload"},true);toast("Chapter photo added")}catch{toast("That file isn’t an image this browser can read.")}});
  const pickTag=only=>{const t=$("#b-tagsel").value;if(!t)return toast("Pick a tag first.");const ids=state.recipes.filter(r=>hasTag(r,t)).map(r=>r.id);upd("selected",only?ids:[...new Set([...b.selected,...ids])],true);toast(`${ids.length} ${t} recipe${ids.length===1?"":"s"} ${only?"selected":"added"}`)};
  $("#b-tagonly").onclick=()=>pickTag(true);$("#b-tagadd").onclick=()=>pickTag(false);
  (async()=>{const pc=$("#pcheck");if(!pc)return;const rs=state.recipes.filter(r=>b.selected.includes(r.id));const res=[];for(const r of rs){const w=await photoW(r.photo);if(!r.photo||w<800)res.push({r,w})}
    if(!$("#pcheck"))return;$("#pcheck").innerHTML=res.length?`<p class="hint" style="margin:0">${res.length} recipe${res.length>1?"s":""} in the book ${res.length>1?"have":"has"} no photo or a small one that may print blurry. Photos 800 pixels wide or more print well.</p>${res.map(o=>`<div class="pq">${o.r.photo?`<img src="${o.r.photo}" alt="">`:""}<span>${esc(o.r.title)} <small class="hint">${o.w?o.w+" px":"no photo"}</small></span><button class="btn sm" data-fix="${o.r.id}">Replace</button></div>`).join("")}`:`<p class="hint" style="margin:0">All photos are large enough to print well.</p>`;
    $("#pcheck").querySelectorAll("[data-fix]").forEach(x=>x.onclick=()=>setView("edit",x.dataset.fix));
    if(rs.some(r=>r.photo))drawPreview()})();
  main.querySelectorAll("[data-addch]").forEach(x=>x.onclick=()=>upd("chapters",[...b.chapters,x.dataset.addch],true));
  const mv=(i,d)=>{const a=[...b.chapters];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];upd("chapters",a,true)};
  main.querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>mv(+x.dataset.up,-1));
  main.querySelectorAll("[data-dn]").forEach(x=>x.onclick=()=>mv(+x.dataset.dn,1));
  main.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>upd("chapters",b.chapters.filter((_,i)=>i!==+x.dataset.rm),true));
  main.querySelectorAll(".picks input").forEach(c=>c.onchange=()=>{const s=new Set(state.book.selected);c.checked?s.add(c.dataset.id):s.delete(c.dataset.id);upd("selected",[...s]);main.querySelector(".panel details:last-of-type > summary").textContent=`Recipes in the book (${s.size})`});
  const all=$("#all");if(all){all.onclick=()=>upd("selected",state.recipes.map(r=>r.id),true);$("#none").onclick=()=>upd("selected",[],true)}
  $("#print").onclick=()=>{if(!state.book.selected.length)return toast("Choose at least one recipe for the book.");doPrint(bookHTML())};
  $("#dl").onclick=downloadBook;
}
function drawPreview(){
  const p=$("#preview");if(!p)return;const bk=bookHTML();
  p.className=bk.cls;p.setAttribute("style",bk.vars);p.innerHTML=bk.html;
  const n=p.querySelectorAll(".pg").length,c=state.book.selected.length;
  $("#pnote").textContent=c?`Preview. ${n} pages, ${c} recipe${c>1?"s":""}.`:"Preview. Add recipes to the book to see their pages.";
  const s=SIZES[state.book.size];p.style.zoom=Math.max(.28,Math.min(1,(p.parentElement.clientWidth-40)/(s[1]*96)));
}
window.addEventListener("resize",()=>{if(state.view==="book")drawPreview()});
const pageCSS=()=>{const s=SIZES[state.book.size];return `@page{size:${s[1]}in ${s[2]}in;margin:0}`};
function doPrint(bk){
  const root=$("#printRoot");root.className=bk.cls;root.setAttribute("style",bk.vars);root.innerHTML=bk.html;
  let st=$("#printStyle");if(!st){st=document.createElement("style");st.id="printStyle";document.head.appendChild(st)}
  st.textContent=`@media print{${pageCSS()} body{background:#fff} .app,.toast{display:none!important} #printRoot{display:block!important} :root{padding:0!important} body::before{display:none} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}`;
  try{window.print()}catch(e){toast("Printing is blocked here. Use Download print file.")}
}
async function downloadBook(){
  if(!state.book.selected.length)return toast("Choose at least one recipe for the book.");
  if(!store.downloads)return toast("Downloads aren’t available in this view.");
  const bk=bookHTML();
  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(state.book.title)}</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Allura&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>${$("#bookcss").textContent}
body{margin:0;background:#ddd}*{box-sizing:border-box}.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}.note{font:15px system-ui;background:#fff;padding:14px 18px;max-width:640px;margin:20px auto 0;border-radius:8px}
@media print{${pageCSS()} body{background:#fff}.note{display:none}.wrap{display:block;padding:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head>
<body><p class="note">Press Ctrl+P (Cmd+P on Mac). Set margins to None, turn on Background graphics, and choose Save as PDF or your printer. Upload the PDF to a print service like Blurb or Lulu.</p><div class="wrap ${bk.cls}" style="${bk.vars}">${bk.html}</div></body></html>`;
  try{await store.downloads.save({filename:(state.book.title||"cookbook").replace(/[^\w\- ]+/g,"").trim()+".html",data:html});toast("Print file saved")}catch(e){if(e.code!=="declined")toast("The file couldn’t be saved. Try Print instead.")}
}
loadLocal();
Object.keys(DEF_BOOK).forEach(k=>{if(state.book[k]===undefined)state.book[k]=DEF_BOOK[k]});
if(!PALETTES[state.book.palette])state.book.palette="linen";
if(!COVERS[state.book.cover])state.book.cover="a";
if(!LAYOUTS[state.book.layout])state.book.layout="mix";
drawPins();setView("home");initCloud();
})();
</script>
</body>
